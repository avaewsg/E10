<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E10 Messenger Pro</title>
    <style>
        :root { 
            --bg-dark: #0f172a; 
            --panel-bg: #1e293b; 
            --accent: #3b82f6; 
            --accent-hover: #2563eb; 
            --text: #f8fafc; 
            --text-sec: #94a3b8; 
            --border-color: #334155;
            --chat-bg: #090d16;
            --bubble-owner: #fef08a; /* زرد برای مالک */
            --bubble-owner-text: #1e293b;
            --bubble-other: #1e293b; /* سفید/تیره برای بقیه */
            --bubble-other-text: #f8fafc;
        }
        body { font-family: Tahoma, sans-serif; background: var(--bg-dark); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }
        
        /* Modal & Auth Styles */
        .auth-box, .modal-box { background: var(--panel-bg); padding: 25px; border-radius: 20px; width: 90%; max-width: 380px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); text-align: center; border: 1px solid var(--border-color); box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #0f172a; border: 1px solid var(--border-color); border-radius: 10px; color: var(--text); box-sizing: border-box; font-size: 14px; outline: none; }
        input:focus { border-color: var(--accent); }
        button { width: 100%; padding: 12px; margin: 10px 0; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 14px; }
        button:hover { background: var(--accent-hover); }

        #app-container { display: flex; width: 100vw; height: 100vh; background: var(--bg-dark); }
        
        /* Sidebar */
        .sidebar { width: 340px; background: var(--panel-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 12px 15px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.03); transition: 0.2s; }
        .chat-item:hover { background: rgba(59, 130, 246, 0.1); }
        
        /* Chat Area */
        .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); position: relative; }
        .chat-header { padding: 12px 20px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); font-weight: bold; font-size: 15px; display: flex; align-items: center; justify-content: space-between; }
        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        
        /* Message Bubbles */
        .message-bubble { max-width: 75%; padding: 10px 14px; border-radius: 14px; word-break: break-word; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); position: relative; display: flex; flex-direction: column; gap: 4px; }
        
        /* رنگ‌بندی پیام‌ها */
        .msg-owner { background: var(--bubble-owner); color: var(--bubble-owner-text); align-self: flex-start; border-top-right-radius: 4px; border: 1px solid #fde047; }
        .msg-other { background: var(--bubble-other); color: var(--bubble-other-text); align-self: flex-start; border-top-left-radius: 4px; border: 1px solid var(--border-color); }
        
        /* Reply Box inside message */
        .reply-preview-box { background: rgba(0,0,0,0.1); padding: 5px 8px; border-right: 3px solid var(--accent); border-radius: 4px; font-size: 12px; margin-bottom: 4px; opacity: 0.85; }

        /* Input Bar & Reply Container */
        .input-container { background: var(--panel-bg); border-top: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .replying-banner { padding: 8px 15px; background: rgba(59,130,246,0.15); display: flex; justify-content: space-between; align-items: center; font-size: 12px; border-bottom: 1px solid var(--border-color); }
        .input-bar { padding: 12px 15px; display: flex; gap: 8px; align-items: center; }
        .input-bar input { margin: 0; flex: 1; }
        
        .verified-badge { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; background: #0ea5e9; color: #ffffff; border-radius: 50%; font-size: 10px; font-weight: bold; margin-right: 4px; vertical-align: middle; }
        .avatar-circle { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; }
        
        /* Dropdown/Context Menu for actions */
        .msg-actions { position: absolute; left: 10px; top: 5px; display: none; gap: 5px; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 6px; }
        .message-bubble:hover .msg-actions { display: flex; }
        .msg-actions button { background: none; border: none; color: white; cursor: pointer; font-size: 11px; padding: 2px 4px; margin: 0; width: auto; }

        @media(max-width: 768px) {
            #app-container { flex-direction: column; }
            .sidebar { width: 100%; height: 32vh; }
            .chat-area { height: 68vh; }
        }
    </style>
</head>
<body>

    <!-- صفحه ورود و ثبت نام -->
    <div id="auth-screen" class="auth-box">
        <h2 style="color: var(--accent); margin-top:0;">E10 Messenger Pro</h2>
        <div id="login-form">
            <input type="text" id="log-user" placeholder="نام کاربری (ایدی)" autocapitalize="none">
            <input type="password" id="log-pass" placeholder="رمز عبور">
            <button onclick="login()">ورود به حساب</button>
            <p onclick="toggleAuth(true)" style="font-size: 12px; cursor: pointer; color: var(--accent);">حساب نداری؟ ثبت‌نام کن</p>
        </div>
        <div id="reg-form" class="hidden">
            <input type="text" id="reg-name" placeholder="نام نمایشی">
            <input type="text" id="reg-user" placeholder="یوزرنیم (آیدی یکتا)" autocapitalize="none">
            <input type="password" id="reg-pass" placeholder="رمز عبور">
            <button onclick="register()">ساخت حساب کاربری</button>
            <p onclick="toggleAuth(false)" style="font-size: 12px; cursor: pointer; color: var(--accent);">قبلاً ثبت‌نام کردی؟ ورود</p>
        </div>
    </div>

    <!-- برنامه اصلی چت -->
    <div id="app-container" class="hidden">
        <div class="sidebar">
            <div class="sidebar-header">
                <div style="display: flex; align-items: center; gap: 10px; overflow: hidden; cursor: pointer;" onclick="openEditProfileModal()" title="ویرایش پروفایل">
                    <div id="sidebar-avatar" class="avatar-circle" style="width:36px; height:36px; font-size:14px;"></div>
                    <div style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                        <h3 id="current-user-display" style="margin: 0; font-size: 13px;"></h3>
                    </div>
                </div>
                <div style="display: flex; gap: 5px;">
                    <button style="width: auto; padding: 6px 10px; margin:0; font-size: 11px;" onclick="openCreateRoomModal()">+ گروه</button>
                    <button title="خروج" style="width: auto; padding: 6px 8px; margin:0; background:#ef4444; font-size: 11px;" onclick="logout()">خروج</button>
                </div>
            </div>
            <div class="chat-list" id="chat-list"></div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div id="active-chat-container" style="display: flex; align-items: center; gap: 8px;">گروه اصلی</div>
                <div id="group-admin-actions" class="hidden">
                    <button style="width:auto; padding:4px 10px; margin:0; font-size:11px; background:#3b82f6;" onclick="openEditGroupModal()">⚙️ تنظیمات گروه</button>
                </div>
            </div>

            <div class="messages-box" id="messages-box"></div>

            <!-- بخش ریپلی شده فعال -->
            <div class="input-container">
                <div id="replying-banner" class="replying-banner hidden">
                    <div><span style="color:var(--accent)">در حال پاسخ به:</span> <span id="reply-text-preview" style="font-weight:bold;"></span></div>
                    <span onclick="cancelReply()" style="cursor:pointer; color:#ef4444; font-weight:bold;">✖</span>
                </div>
                <div class="input-bar">
                    <input type="file" id="file-input" style="display:none" onchange="sendFile(this)">
                    <button style="width:40px; height:40px; margin:0; background:#334155; color:var(--text); border-radius:10px; border:none;" onclick="document.getElementById('file-input').click()">📷</button>
                    <input type="text" id="msg-input" placeholder="پیام خود را بنویسید..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button style="width:75px; margin:0; height:40px;" onclick="sendMessage()">ارسال</button>
                </div>
            </div>
        </div>
    </div>

    <!-- مودال ویرایش پروفایل کاربر -->
    <div id="profile-modal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; z-index:1000;">
        <div class="modal-box">
            <h3 style="color:var(--accent); margin-top:0;">ویرایش پروفایل</h3>
            <input type="text" id="edit-name-input" placeholder="نام جدید شما">
            <button onclick="updateProfileName()">ذخیره تغییرات</button>
            <button style="background:#475569;" onclick="document.getElementById('profile-modal').classList.add('hidden')">انصراف</button>
        </div>
    </div>

    <!-- مودال تنظیمات گروه (مخصوص مالک) -->
    <div id="group-modal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:flex; justify-content:center; align-items:center; z-index:1000;">
        <div class="modal-box">
            <h3 style="color:var(--accent); margin-top:0;">تنظیمات گروه</h3>
            <input type="text" id="edit-group-name-input" placeholder="نام جدید گروه">
            <p style="font-size:11px; color:var(--text-sec); text-align:right; margin:5px 0;">تغییر تصویر گروه:</p>
            <input type="file" id="edit-group-avatar-file" accept="image/*" onchange="previewGroupAvatar(event)">
            <button onclick="saveGroupSettings()">اعمال تغییرات گروه</button>
            <button style="background:#475569;" onclick="document.getElementById('group-modal').classList.add('hidden')">انصراف</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let activeChatId = 'main_group';
        let currentChatObj = null;
        let chatsData = [];
        let replyingToMsg = null;
        let base64GroupAvatar = '';

        window.onload = () => {
            const savedUser = localStorage.getItem('e10_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                enterApp();
            }
        };

        function toggleAuth(isReg) {
            document.getElementById('login-form').classList.toggle('hidden', isReg);
            document.getElementById('reg-form').classList.toggle('hidden', !isReg);
        }

        function register() {
            const name = document.getElementById('reg-name').value.trim();
            const username = document.getElementById('reg-user').value.trim().toLowerCase();
            const password = document.getElementById('reg-pass').value.trim();
            if(!username || !password || !name) return alert('تمام فیلدها را پر کنید.');
            socket.emit('register', { name, username, password });
        }

        function login() {
            const username = document.getElementById('log-user').value.trim().toLowerCase();
            const password = document.getElementById('log-pass').value.trim();
            if(!username || !password) return alert('لطفاً اطلاعات را کامل وارد کنید.');
            socket.emit('login', { username, password });
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        socket.on('auth_success', (user) => {
            currentUser = user;
            localStorage.setItem('e10_user', JSON.stringify(user));
            enterApp();
        });

        socket.on('auth_error', (err) => alert(err));

        function enterApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            updateUserUI();
            socket.emit('get_user_chats');
            socket.emit('join_room', activeChatId);
        }

        function updateUserUI() {
            let badge = (currentUser.isOwner || currentUser.isVerified) ? '<span class="verified-badge">✓</span>' : '';
            document.getElementById('current-user-display').innerHTML = `${currentUser.name} ${badge} <br><small style="color:var(--text-sec)">@${currentUser.username}</small>`;
            document.getElementById('sidebar-avatar').innerText = currentUser.name.charAt(0).toUpperCase();
        }

        function openEditProfileModal() {
            document.getElementById('edit-name-input').value = currentUser.name;
            document.getElementById('profile-modal').classList.remove('hidden');
        }

        function updateProfileName() {
            const newName = document.getElementById('edit-name-input').value.trim();
            if(newName) {
                socket.emit('update_profile', { username: currentUser.username, newName });
                document.getElementById('profile-modal').classList.add('hidden');
            }
        }

        socket.on('profile_updated', (updatedUser) => {
            if(updatedUser.username === currentUser.username) {
                currentUser.name = updatedUser.name;
                localStorage.setItem('e10_user', JSON.stringify(currentUser));
                updateUserUI();
            }
        });

        function openCreateRoomModal() {
            const roomName = prompt('نام گروه جدید را وارد کنید:');
            if(roomName) socket.emit('create_room', { name: roomName, admin: currentUser.username });
        }

        socket.on('room_created', (newRoom) => {
            chatsData.push(newRoom);
            renderChatList(chatsData);
            selectRoom(newRoom.id);
        });

        socket.on('user_chats_loaded', (chats) => {
            chatsData = chats;
            renderChatList(chatsData);
            selectRoom(activeChatId);
        });

        function renderChatList(chats) {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            chats.forEach(chat => {
                let badge = chat.isVerified ? '<span class="verified-badge">✓</span>' : '';
                list.innerHTML += `<div class="chat-item" onclick="selectRoom('${chat.id}')">
                    <div class="avatar-circle" style="background:#3b82f6;">${chat.name.charAt(0)}</div>
                    <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"><b>${chat.name}</b> ${badge}<br><small style="color:var(--text-sec)">گروه عمومی</small></div>
                </div>`;
            });
        }

        function selectRoom(id) {
            activeChatId = id;
            currentChatObj = chatsData.find(c => c.id === id);
            if(currentChatObj) {
                let badge = currentChatObj.isVerified ? '<span class="verified-badge">✓</span>' : '';
                document.getElementById('active-chat-container').innerHTML = `<div class="avatar-circle" style="width:325px;height:32px;font-size:12px;">${currentChatObj.name.charAt(0)}</div> ${currentChatObj.name} ${badge}`;
                
                // نمایش تنظیمات گروه فقط اگر کاربر مالک باشد یا ادمین گروه
                if(currentUser.isOwner || currentChatObj.admin === currentUser.username) {
                    document.getElementById('group-admin-actions').classList.remove('hidden');
                } else {
                    document.getElementById('group-admin-actions').classList.add('hidden');
                }
            }
            socket.emit('join_room', id);
        }

        function openEditGroupModal() {
            if(!currentChatObj) return;
            document.getElementById('edit-group-name-input').value = currentChatObj.name;
            document.getElementById('group-modal').classList.remove('hidden');
        }

        function previewGroupAvatar(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = e => { base64GroupAvatar = e.target.result; };
                reader.readAsDataURL(file);
            }
        }

        function saveGroupSettings() {
            const newName = document.getElementById('edit-group-name-input').value.trim();
            if(newName && currentChatObj) {
                socket.emit('update_group', { chatId: currentChatObj.id, name: newName, avatar: base64GroupAvatar || currentChatObj.avatar });
                document.getElementById('group-modal').classList.add('hidden');
            }
        }

        socket.on('group_updated', (updatedChat) => {
            const idx = chatsData.findIndex(c => c.id === updatedChat.id);
            if(idx !== -1) {
                chatsData[idx] = updatedChat;
                renderChatList(chatsData);
                if(activeChatId === updatedChat.id) selectRoom(updatedChat.id);
            }
        });

        function sendMessage() {
            const text = document.getElementById('msg-input').value.trim();
            if(!text) return;
            socket.emit('send_message', { 
                chatId: activeChatId, 
                sender: currentUser.username, 
                content: text, 
                type: 'text',
                replyTo: replyingToMsg 
            });
            document.getElementById('msg-input').value = '';
            cancelReply();
        }

        function sendFile(input) {
            const file = input.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = e => {
                    socket.emit('send_message', { 
                        chatId: activeChatId, 
                        sender: currentUser.username, 
                        content: e.target.result, 
                        type: 'image',
                        replyTo: replyingToMsg 
                    });
                    cancelReply();
                };
                reader.readAsDataURL(file);
            }
        }

        function setReply(msgId, senderName, content) {
            replyingToMsg = { id: msgId, senderName, content: content.length > 30 ? content.substring(0,30)+'...' : content };
            document.getElementById('reply-text-preview').innerText = `${senderName}: ${replyingToMsg.content}`;
            document.getElementById('replying-banner').classList.remove('hidden');
        }

        function cancelReply() {
            replyingToMsg = null;
            document.getElementById('replying-banner').classList.add('hidden');
        }

        function deleteMessage(msgId) {
            if(confirm('آیا مطمئن هستید که می‌خواهید این پیام را حذف کنید؟')) {
                socket.emit('delete_message', { chatId: activeChatId, msgId, username: currentUser.username });
            }
        }

        socket.on('message_deleted', ({ chatId, msgId }) => {
            if(chatId === activeChatId) {
                const el = document.getElementById(msgId);
                if(el) el.remove();
            }
        });

        socket.on('load_history', (messages) => {
            const box = document.getElementById('messages-box');
            box.innerHTML = '';
            messages.forEach(m => appendMessage(m));
        });

        socket.on('new_message', ({ chatId, msg }) => {
            if(chatId === activeChatId) appendMessage(msg);
        });

        function appendMessage(msg) {
            const box = document.getElementById('messages-box');
            let badge = msg.isVerified ? '<span class="verified-badge">✓</span>' : '';
            let contentHtml = msg.type === 'image' ? `<img src="${msg.content}" style="max-width:100%; width:200px; border-radius:10px; display:block; margin-top:4px;">` : escapeHtml(msg.content);
            
            // تعیین استایل حباب بر اساس مالک بودن فرستنده پیام
            let isOwnerMsg = (msg.sender === 'kia12' || msg.sender === 'kiya12' || msg.isVerified);
            let bubbleClass = isOwnerMsg ? 'msg-owner' : 'msg-other';

            let replyHtml = '';
            if(msg.replyTo) {
                replyHtml = `<div class="reply-preview-box"><b>${msg.replyTo.senderName}:</b> ${msg.replyTo.content}</div>`;
            }

            box.innerHTML += `
                <div id="${msg.id}" class="message-bubble ${bubbleClass}">
                    <div class="msg-actions">
                        <button onclick="setReply('${msg.id}', '${msg.senderName}', '${escapeHtml(msg.content)}')">↩️</button>
                        <button onclick="deleteMessage('${msg.id}')">🗑️</button>
                    </div>
                    ${replyHtml}
                    <div><strong style="color: ${isOwnerMsg ? '#854d0e' : 'var(--accent)'};">${msg.senderName}</strong> ${badge}</div>
                    <div style="margin-top: 2px;">${contentHtml}</div>
                    <span style="font-size: 9px; opacity: 0.7; align-self: flex-end; margin-top: 2px;">${msg.time}</span>
                </div>`;
            box.scrollTop = box.scrollHeight;
        }

        function escapeHtml(text) {
            if(typeof text !== 'string') return text;
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
