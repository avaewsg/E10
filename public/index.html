<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E10 Messenger Pro</title>
    <style>
        :root { --bg-dark: #0b0914; --panel-bg: #131022; --accent: #7c3aed; --accent-hover: #6d28d9; --text: #f3f4f6; --text-sec: #9ca3af; }
        body { font-family: Tahoma, sans-serif; background: var(--bg-dark); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }
        
        /* استایل فرم‌های ورود و ثبت‌نام */
        .auth-box { background: var(--panel-bg); padding: 30px; border-radius: 16px; width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; border: 1px solid rgba(124, 58, 237, 0.2); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; background: #1a162b; border: 1px solid #2d264a; border-radius: 8px; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin: 10px 0; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--accent-hover); }

        /* محیط اصلی اپلیکیشن */
        #app-container { display: flex; width: 100vw; height: 100vh; background: var(--bg-dark); }
        .sidebar { width: 360px; background: var(--panel-bg); border-left: 1px solid #2d264a; display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d264a; }
        .chat-list { flex: 1; overflow-y: auto; }
        .chat-item { padding: 12px 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .chat-item:hover { background: rgba(124, 58, 237, 0.1); }
        
        .chat-area { flex: 1; display: flex; flex-direction: column; background: #07050d; }
        .chat-header { padding: 15px 20px; background: var(--panel-bg); border-bottom: 1px solid #2d264a; display: flex; align-items: center; justify-content: space-between; }
        .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message-bubble { max-width: 60%; padding: 10px 15px; border-radius: 12px; word-break: break-word; font-size: 14px; background: #1a162b; }
        .message-bubble.my { background: var(--accent); align-self: flex-end; }
        
        .input-bar { padding: 15px; background: var(--panel-bg); display: flex; gap: 10px; align-items: center; }
        .input-bar input { margin: 0; flex: 1; }
        
        /* تیک آبی کوچک اختصاصی */
        .verified-badge { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            width: 14px; 
            height: 14px; 
            background: #38bdf8; 
            color: #0b0914; 
            border-radius: 50%; 
            font-size: 9px; 
            font-weight: bold; 
            margin-right: 4px; 
            vertical-align: middle;
        }
        .avatar-preview { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin: 5px auto; border: 2px solid var(--accent); }
    </style>
</head>
<body>

    <!-- صفحه ورود / ثبت نام -->
    <div id="auth-screen" class="auth-box">
        <h2 style="color: #a78bfa; margin-top:0;">E10 Messenger</h2>
        <div id="login-form">
            <input type="text" id="log-user" placeholder="نام کاربری (ایدی)">
            <input type="password" id="log-pass" placeholder="رمز عبور">
            <button onclick="login()">ورود به حساب</button>
            <p onclick="toggleAuth(true)" style="font-size: 12px; cursor: pointer; color: #a78bfa;">حساب نداری؟ ثبت‌نام کن</p>
        </div>
        <div id="reg-form" class="hidden">
            <input type="text" id="reg-name" placeholder="نام نمایشی">
            <input type="text" id="reg-user" placeholder="یوزرنیم (آیدی یکتا)">
            <input type="password" id="reg-pass" placeholder="رمز عبور">
            <p style="font-size:11px; color:var(--text-sec); margin:5px 0 0 0;">انتخاب عکس پروفایل:</p>
            <input type="file" id="reg-avatar-file" accept="image/*" onchange="previewAvatar(event)">
            <img id="avatar-preview" class="avatar-preview hidden">
            <button onclick="register()">ساخت حساب کاربری</button>
            <p onclick="toggleAuth(false)" style="font-size: 12px; cursor: pointer; color: #a78bfa;">قبلاً ثبت‌نام کردی؟ ورود</p>
        </div>
    </div>

    <!-- محیط اصلی اپلیکیشن -->
    <div id="app-container" class="hidden">
        <div class="sidebar">
            <div class="sidebar-header">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <!-- دکمه خروج / بازگشت به صفحه ورود در گوشه بالای پنل -->
                    <button title="خروج از حساب" style="width: auto; padding: 6px 10px; margin:0; background:#ef4444; font-size: 12px;" onclick="logout()">🚪 خروج</button>
                    <div>
                        <h3 id="current-user-display" style="margin: 0; color: #a78bfa; font-size: 14px;"></h3>
                    </div>
                </div>
                <div style="display: flex; gap: 4px;">
                    <button id="owner-btn" class="hidden" style="width: auto; padding: 6px 8px; margin:0; background:#0284c7; font-size:12px;" onclick="openOwnerPanel()">👑 مالک</button>
                    <button style="width: auto; padding: 6px 8px; margin:0; font-size:12px;" onclick="openCreateRoomModal()">+ گروه</button>
                </div>
            </div>
            <div style="padding: 10px;">
                <input type="text" id="search-box" placeholder="جستجوی آیدی یا کانال..." oninput="searchTarget(this.value)">
            </div>
            <div class="chat-list" id="chat-list">
                <div style="text-align:center; color:var(--text-sec); padding:20px; font-size:13px;">برای شروع آیدی کسی را جستجو کنید</div>
            </div>
        </div>
        <div class="chat-area">
            <div class="chat-header" id="active-chat-title">یک گفتگو را انتخاب کنید</div>
            <div class="messages-box" id="messages-box"></div>
            <div class="input-bar" id="input-bar-area" style="display: none;">
                <input type="file" id="file-input" style="display:none" onchange="sendFile(this)">
                <button style="width:40px; margin:0;" onclick="document.getElementById('file-input').click()">📷</button>
                <input type="text" id="msg-input" placeholder="پیام خود را بنویسید..." onkeypress="if(event.key==='Enter') sendMessage()">
                <button style="width:80px; margin:0;" onclick="sendMessage()">ارسال</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let activeChatId = null;
        let base64Avatar = '';

        window.onload = () => {
            const savedUser = localStorage.getItem('e10_user');
            const loginTime = localStorage.getItem('e10_time');
            if (savedUser && loginTime) {
                const twoDays = 2 * 24 * 60 * 60 * 1000;
                if (Date.now() - parseInt(loginTime) < twoDays) {
                    currentUser = JSON.parse(savedUser);
                    enterApp();
                } else {
                    alert('نشست ۲ روزه شما منقضی شد. لطفاً رمز عبور را مجدداً وارد کنید.');
                    localStorage.clear();
                }
            }
        };

        function toggleAuth(isReg) {
            document.getElementById('login-form').classList.toggle('hidden', isReg);
            document.getElementById('reg-form').classList.toggle('hidden', !isReg);
        }

        function previewAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    base64Avatar = e.target.result;
                    const preview = document.getElementById('avatar-preview');
                    preview.src = base64Avatar;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function register() {
            const name = document.getElementById('reg-name').value;
            const username = document.getElementById('reg-user').value;
            const password = document.getElementById('reg-pass').value;
            if(!username || !password) return alert('نام کاربری و رمز عبور الزامی است');
            socket.emit('register', { name, username, password, avatar: base64Avatar });
        }

        function login() {
            const username = document.getElementById('log-user').value;
            const password = document.getElementById('log-pass').value;
            socket.emit('login', { username, password });
        }

        // تابع خروج از حساب کاربری
        function logout() {
            localStorage.clear();
            location.reload();
        }

        socket.on('auth_success', (user) => {
            currentUser = user;
            localStorage.setItem('e10_user', JSON.stringify(user));
            localStorage.setItem('e10_time', Date.now().toString());
            enterApp();
        });

        socket.on('auth_error', (err) => alert(err));
        socket.on('password_expired', (err) => alert(err));

        function enterApp() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
            
            let badge = currentUser.isVerified ? '<span class="verified-badge">✓</span>' : '';
            document.getElementById('current-user-display').innerHTML = `${currentUser.name} ${badge} <br><small style="color:var(--text-sec)">@${currentUser.username}</small>`;
            
            if (currentUser.username === 'kia12' || currentUser.isOwner) {
                document.getElementById('owner-btn').classList.remove('hidden');
            }
        }

        function searchTarget(query) {
            if(query.length > 0) socket.emit('search', query);
        }

        socket.on('search_results', (results) => {
            const list = document.getElementById('chat-list');
            list.innerHTML = '';
            results.forEach(item => {
                let badge = item.isVerified ? '<span class="verified-badge">✓</span>' : '';
                if(item.type === 'user') {
                    if(item.username !== currentUser.username) {
                        let avatarImg = item.avatar ? `<img src="${item.avatar}" width="36" height="36" style="border-radius:50%; object-fit:cover;">` : `<div style="width:36px;height:36px;background:#2d264a;border-radius:50%;display:flex;align-items:center;justify-content:center;">👤</div>`;
                        list.innerHTML += `<div class="chat-item" onclick="startPv('${item.username}', '${item.name}')">
                            ${avatarImg}
                            <div><b>${item.name}</b> ${badge}<br><small style="color:var(--text-sec)">@${item.username}</small></div>
                        </div>`;
                    }
                } else {
                    list.innerHTML += `<div class="chat-item" onclick="selectRoom('${item.id}', '${item.name}', '${item.type}')">
                        <div style="width:36px;height:36px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;">📢</div>
                        <div><b>${item.name}</b> ${badge}<br><small style="color:var(--text-sec)">${item.type === 'group' ? 'گروه' : 'کانال'}</small></div>
                    </div>`;
                }
            });
        });

        function openOwnerPanel() {
            const target = prompt('یوزر مورد نظر (آیدی بدون @) جهت اعطای/گرفتن تیک آبی را وارد کنید:');
            if(target) {
                socket.emit('toggle_verified', { targetUsername: target, adminUsername: currentUser.username });
            }
        }

        socket.on('notification', (msg) => alert(msg));

        function startPv(targetUsername, targetName) {
            const sortedUsers = [currentUser.username, targetUsername].sort();
            const pvChatId = `pv_${sortedUsers[0]}_${sortedUsers[1]}`;
            selectRoom(pvChatId, `پی‌وی: ${targetName} (@${targetUsername})`, 'pv');
        }

        function openCreateRoomModal() {
            const name = prompt('نام گروه یا کانال را وارد کنید:');
            const type = confirm('برای ساخت گروه تایید و برای کانال لغو را بزنید') ? 'group' : 'channel';
            if(name) {
                socket.emit('create_room', { name, type, admin: currentUser.username });
            }
        }

        socket.on('room_created', (room) => {
            selectRoom(room.id, room.name, room.type);
        });

        function selectRoom(id, name, type) {
            activeChatId = id;
            document.getElementById('active-chat-title').innerText = name;
            document.getElementById('input-bar-area').style.display = 'flex';
            socket.emit('join_room', id);
        }

        socket.on('load_history', (messages) => {
            const box = document.getElementById('messages-box');
            box.innerHTML = '';
            messages.forEach(m => appendMessage(m));
        });

        function sendMessage() {
            const text = document.getElementById('msg-input').value.trim();
            if(!text || !activeChatId) return;
            socket.emit('send_message', { chatId: activeChatId, sender: currentUser.username, content: text, type: 'text' });
            document.getElementById('msg-input').value = '';
        }

        function sendFile(input) {
            const file = input.files[0];
            if(file && activeChatId) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    socket.emit('send_message', { chatId: activeChatId, sender: currentUser.username, content: e.target.result, type: 'image' });
                };
                reader.readAsDataURL(file);
            }
        }

        socket.on('new_message', ({ chatId, msg }) => {
            if(chatId === activeChatId) appendMessage(msg);
        });

        function appendMessage(msg) {
            const box = document.getElementById('messages-box');
            const isMy = msg.sender === currentUser.username;
            let content = msg.type === 'image' ? `<img src="${msg.content}" width="180" style="border-radius:8px; display:block;">` : escapeHtml(msg.content);
            box.innerHTML += `<div class="message-bubble ${isMy ? 'my' : ''}"><small style="opacity:0.7">${msg.sender}</small><br>${content}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
